<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=frontend/index.html">
  <title>ShopEase — Opening Store...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0b0f19 80%);
      color: #f8fafc;
      -webkit-font-smoothing: antialiased;
      padding: 20px;
    }
    .redirect-card {
      text-align: center;
      background: #161f30;
      padding: 44px 36px;
      border-radius: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
      max-width: 440px;
      width: 100%;
      border: 1px solid #243046;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .redirect-icon-wrapper {
      position: relative;
      margin-bottom: 20px;
    }
    .redirect-icon {
      font-size: 2.8rem;
      width: 76px;
      height: 76px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.25);
    }
    .spinner {
      position: absolute;
      top: -4px;
      left: -4px;
      right: -4px;
      bottom: -4px;
      border: 3px solid transparent;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 1.45rem;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: -0.4px;
      margin-bottom: 8px;
    }
    p {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.55;
      margin-bottom: 22px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 28px;
      background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
      color: #ffffff;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.96rem;
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.35);
      transition: all 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
    }
  </style>
  <script>
    // Seamless instant redirect for Live Server and static hosting
    window.location.replace("frontend/index.html");
  </script>
</head>
<body>
  <div class="redirect-card">
    <div class="redirect-icon-wrapper">
      <div class="spinner"></div>
      <div class="redirect-icon">🛍️</div>
    </div>
    <h2>Opening ShopEase Store...</h2>
    <p>If you are not redirected automatically, please click below to enter the store:</p>
    <a href="frontend/index.html" class="btn">Enter ShopEase &rarr;</a>
  </div>
</body>
</html>
